<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gin File Upload Demo</title>
  <style>
    :root {
      --bg: #f5f1e8;
      --panel: #fffaf1;
      --text: #1f2937;
      --accent: #c2410c;
      --border: #e5d5bf;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top, #fff6df 0%, transparent 35%),
        linear-gradient(135deg, #f3eadb, var(--bg));
    }

    .card {
      width: min(92vw, 460px);
      padding: 32px 28px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--panel);
      box-shadow: 0 20px 45px rgba(109, 76, 34, 0.12);
    }

    h1 {
      margin: 0 0 10px;
      font-size: 28px;
    }

    p {
      margin: 0 0 20px;
      line-height: 1.6;
    }

    .field {
      display: grid;
      gap: 10px;
      margin-bottom: 18px;
    }

    input[type="file"] {
      padding: 12px;
      border: 1px dashed var(--border);
      border-radius: 12px;
      background: #fff;
    }

    button {
      width: 100%;
      padding: 12px 16px;
      border: 0;
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #9a3412;
    }

    #status {
      margin-top: 16px;
      min-height: 24px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>多文件上传测试</h1>
    <p>选择一个或多个文件后点击上传，表单会以 <code>multipart/form-data</code> 的方式提交到 <code>/uploads</code>，字段名为 <code>f1</code>。</p>

    <form id="uploadForm" action="/uploads" method="post" enctype="multipart/form-data">
      <div class="field">
        <label for="fileInput">选择文件</label>
        <input id="fileInput" name="f1" type="file" multiple required>
      </div>
      <button type="submit">上传文件</button>
    </form>

    <div id="status"></div>
  </main>

  <script>
    const form = document.getElementById("uploadForm");
    const fileInput = document.getElementById("fileInput");
    const status = document.getElementById("status");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (!fileInput.files.length) {
        status.textContent = "请先选择至少一个文件。";
        return;
      }

      const formData = new FormData(form);
      status.textContent = "正在上传...";

      try {
        const response = await fetch("/uploads", {
          method: "POST",
          body: formData
        });

        if (!response.ok) {
          const text = await response.text();
          status.textContent = `上传失败：${text || response.status}`;
          return;
        }

        const names = Array.from(fileInput.files).map((file) => file.name).join("、");
        status.textContent = `上传成功：${names}`;
        form.reset();
      } catch (error) {
        status.textContent = `请求失败：${error}`;
      }
    });
  </script>
</body>
</html>
